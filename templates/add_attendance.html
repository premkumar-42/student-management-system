{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Mark Attendance</h2>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Mark Attendance
                </button>

                <a href="{% url 'attendance_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
