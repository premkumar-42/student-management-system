{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row">

        <div class="col-md-6 col-lg-6 col-12">

            <h1 class="mb-4">Add Student</h1>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="btn btn-success">
                    Add Student
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
