{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h3>Delete Marks</h3>

            <p>
                Are you sure you want to delete
                <strong>{{ mark.student.name }}</strong>'s
                {{ mark.subject }} marks?
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'marks_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
