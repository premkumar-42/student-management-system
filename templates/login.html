{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="row">
        <div class="col-md-6">

            <h2>Login</h2>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Login
                </button>

            </form>

        </div>
    </div>

</div>

<a href="{% url 'password_reset' %}">
    Forgot Password?
</a>

{% endblock %}
