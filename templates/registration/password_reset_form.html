{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Forgot Password</h2>

    <p>
        Enter your email address and we will send you
        a password reset link.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Send Reset Link
        </button>

    </form>

</div>

{% endblock %}
